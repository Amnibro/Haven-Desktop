<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading Haven…</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{
      height:100%;width:100%;
      background:#0b0d12;color:#eef1f6;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
      overflow:hidden;user-select:none;-webkit-user-select:none;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{
      position:absolute;inset:0;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:18px;
    }
    .hex{
      width:88px;height:88px;
      border-radius:22px;
      filter:drop-shadow(0 0 28px rgba(109,40,217,.35));
      animation:pulse 2.2s ease-in-out infinite;
      image-rendering:-webkit-optimize-contrast;
    }
    @keyframes pulse{
      0%,100%{transform:scale(1);opacity:1}
      50%{transform:scale(1.04);opacity:.88}
    }
    h1{
      font-size:24px;font-weight:680;letter-spacing:-.03em;margin:0;
    }
    h1 .brand{color:#F5F5F7}
    .status{color:#6E6E73;font-size:13.5px;letter-spacing:-.01em}
    .spinner{
      width:26px;height:26px;
      border:2px solid rgba(255,255,255,.1);
      border-top-color:#00ff9d;
      border-radius:50%;
      animation:spin .8s linear infinite;
      margin-top:4px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .footer{
      position:absolute;bottom:16px;left:0;right:0;
      text-align:center;color:#6E6E73;font-size:11.5px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="hex" src="splash-icon.png" alt="Haven">
    <h1>Loading <span class="brand">Haven</span>…</h1>
    <div class="spinner" aria-label="Loading"></div>
    <div class="status">Connecting to your server</div>
  </div>
  <div class="footer">Haven Desktop</div>
</body>
</html>

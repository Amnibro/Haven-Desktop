<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading Haven…</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0d0d1a;
      color: #e8e6f2;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: grid;
      place-items: center;
    }
    .wrap { text-align: center; }
    .hex {
      font-size: 48px;
      color: #8b6ce7;
      animation: pulse 1.6s ease-in-out infinite;
    }
    h1 {
      margin: 12px 0 6px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0;
      color: #9a96b0;
      font-size: 13px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hex" aria-hidden="true">⬡</div>
    <h1 data-i18n="splash.heading">Loading Haven…</h1>
    <p data-i18n="splash.subheading">Connecting to your server</p>
  </div>
</body>
</html>

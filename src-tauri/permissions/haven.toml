[[permission]]
identifier = "allow-haven"
description = "Allows Haven Desktop custom commands"
commands.allow = [
  "i18n_get_state",
  "i18n_set_language",
  "i18n_refresh_automatic",
  "server_detect",
  "server_start",
  "server_stop",
  "server_status",
  "server_browse",
  "settings_get",
  "settings_set",
  "app_version",
  "nav_open_app",
  "nav_back_to_welcome",
  "nav_switch_server",
  "nav_change_primary_server",
  "nav_page_ready",
  "nav_connection_info",
  "window_minimize",
  "window_maximize",
  "window_close",
  "window_enter_fullscreen",
  "window_leave_fullscreen",
  "open_external",
  "notify",
  "notification_badge",
  "get_server_badges",
  "report_known_server_urls",
  "server_history_get",
  "server_history_add",
  "server_history_remove",
  "server_history_update_name",
  "desktop_get_prefs",
  "desktop_set_start_on_login",
  "desktop_set_start_hidden",
  "desktop_set_minimize_to_tray",
  "desktop_set_force_sdr",
  "desktop_set_hide_menu_bar",
  "desktop_set_disable_gpu_vsync",
  "desktop_set_unlimit_frame_rate",
  "shortcuts_get",
  "shortcuts_register",
  "update_download",
  "update_install",
  "clipboard_write_text",
  "clipboard_write_image",
  "save_image",
  "audio_is_supported",
  "audio_get_apps",
  "share_picker_choose",
  "audio_stop_capture",
  "dialog_alert",
  "dialog_confirm",
  "dialog_prompt",
  "get_inject_script",
  "theme_colors"
]


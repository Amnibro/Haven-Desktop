[package]
name = "haven-desktop"
version = "2.5.3"
description = "Haven Desktop — Private chat client (Tauri)"
authors = ["Haven Contributors"]
edition = "2021"
license = "AGPL-3.0"

[lib]
name = "haven_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.1", features = [] }
cc = "1.2"
pkg-config = "0.3"

[dependencies]
tauri = { version = "=3.0.0-alpha.2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "=3.0.0-alpha.1"
tauri-plugin-single-instance = "=3.0.0-alpha.1"
tauri-plugin-updater = "=3.0.0-alpha.1"
tiny-skia = "0.11"
tauri-plugin-dialog = { version = "=3.0.0-alpha.1", default-features = false, features = ["xdg-portal"] }
tauri-plugin-notification = "=3.0.0-alpha.1"
tauri-plugin-store = "=3.0.0-alpha.1"
tauri-plugin-shell = "=3.0.0-alpha.1"
tauri-plugin-process = "=3.0.0-alpha.1"
tauri-plugin-clipboard-manager = "=3.0.0-alpha.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
once_cell = "1.20"
base64 = "0.22"
url = "2"
dirs = "6"
which = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "=3.0.0-alpha.1"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18"
zbus = "5.19"
sha2 = "0.10"
x11-dl = "2.21"
tauri-runtime-cef = { version = "=3.0.0-alpha.2", features = ["devtools"] }

[patch.crates-io]
tauri-runtime-cef = { path = "vendor/tauri-runtime-cef" }

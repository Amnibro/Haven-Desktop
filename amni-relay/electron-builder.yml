appId: com.amni.relay
productName: Amni Relay
copyright: Copyright Amni Workspace

directories:
  output: dist
  buildResources: assets

files:
  - "src/**/*"
  - "assets/**/*"
  - "PRODUCT.md"
  - "package.json"

extraMetadata:
  name: amni-relay
  productName: Amni Relay

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.svg

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: assets/icon.svg
  category: Network;Chat;InstantMessaging
  desktop:
    Name: Amni Relay
    Comment: Amni Workspace communications client
    Terminal: false

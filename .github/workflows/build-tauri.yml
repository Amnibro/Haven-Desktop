name: Build Haven Desktop (Tauri)

on:
  push:
    branches:
      - cursor/tauri-port-3a53
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          retention-days: 30
          if-no-files-found: error

  build-linux:
    # 22.04 keeps the glibc floor low so the AppImage runs on older distros;
    # webkit2gtk 4.1 is the engine Tauri 2 needs. libpulse is for per-app audio.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl wget file patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libpulse-dev libxdo-dev
      - run: npm ci
      - name: Build AppImage and deb
        env:
          CXX: g++
          NO_STRIP: "true"
        run: npm run tauri build -- --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Updater manifest and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="v2.0.0-tauri"; fi
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          EXE=$(basename "$(ls dist/haven-desktop-windows/*-setup.exe | head -1)")
          APPIMAGE=$(basename "$(ls dist/haven-desktop-linux/*.AppImage | head -1)")
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          node -e "
            const fs=require('fs'); const enc=encodeURIComponent;
            fs.writeFileSync('dist/latest.json', JSON.stringify({
              version: '$VERSION', notes: 'Haven Desktop (Tauri) $VERSION', pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': { signature: fs.readFileSync('dist/haven-desktop-windows/$EXE.sig','utf8').trim(), url: '$BASE/' + enc('$EXE') },
                'linux-x86_64':   { signature: fs.readFileSync('dist/haven-desktop-linux/$APPIMAGE.sig','utf8').trim(), url: '$BASE/' + enc('$APPIMAGE') }
              }
            }, null, 2));"
          cat dist/latest.json
          TITLE="${TAG#v}"
          NOTES="Haven Desktop Tauri build (${TITLE}). Windows NSIS installer, Linux AppImage and deb. Requires a Haven server. Self-signed server certificates are accepted on Windows and Linux."
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Haven ${TITLE}" --notes "$NOTES" --latest
          fi
          mapfile -t FILES < <(ls -1 dist/haven-desktop-windows/* dist/haven-desktop-linux/* dist/latest.json)
          gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Released: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

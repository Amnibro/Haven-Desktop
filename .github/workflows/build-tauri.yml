name: Build Haven Desktop (Tauri)

on:
  push:
    branches:
      - cursor/tauri-port-3a53
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v2.0.0-tauri"
          fi
          TITLE="${TAG#v}"
          NOTES="Haven Desktop Tauri build (${TITLE}).

Windows one-click NSIS installer — same idea as the Electron Haven-Setup-*.exe releases.

Requires a Haven server to connect to."
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Haven ${TITLE}" \
              --notes "$NOTES" \
              --latest=false
          fi
          mapfile -t FILES < <(ls -1 src-tauri/target/release/bundle/nsis/*.exe)
          gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Released: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

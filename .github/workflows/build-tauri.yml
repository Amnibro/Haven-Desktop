name: Build Haven Desktop (Tauri)

on:
  push:
    branches:
      - cursor/tauri-port-3a53
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - name: Build Windows NSIS installer
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          retention-days: 30
          if-no-files-found: error

  build-linux:
    # 22.04 keeps the glibc floor low so the AppImage runs on older distros;
    # webkit2gtk 4.1 is the engine Tauri 2 needs. libpulse is for per-app audio.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl wget file patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libpulse-dev libxdo-dev
      - run: npm ci
      - name: Build AppImage and deb
        env:
          CXX: g++
          NO_STRIP: "true"
        run: npm run tauri build -- --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Updater manifest and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # Branch pushes publish to the release of the version in tauri.conf.json,
          # so bumping the version is what moves testers and the updater forward.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}-tauri"; fi
          # download-artifact keeps each artifact's folder layout (nsis/ is flat,
          # the Linux one has appimage/ and deb/), so locate files instead of globbing.
          EXE_PATH=$(find dist -name '*-setup.exe' | head -1)
          APPIMAGE_PATH=$(find dist -name '*.AppImage' | head -1)
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          EXE_PATH="$EXE_PATH" APPIMAGE_PATH="$APPIMAGE_PATH" BASE="$BASE" VERSION="$VERSION" node -e "
            const fs=require('fs'), path=require('path'); const enc=encodeURIComponent; const e=process.env;
            const plat=(p)=>({ signature: fs.readFileSync(p+'.sig','utf8').trim(), url: e.BASE+'/'+enc(path.basename(p)) });
            fs.writeFileSync('dist/latest.json', JSON.stringify({
              version: e.VERSION, notes: 'Haven Desktop (Tauri) '+e.VERSION, pub_date: new Date().toISOString(),
              platforms: { 'windows-x86_64': plat(e.EXE_PATH), 'linux-x86_64': plat(e.APPIMAGE_PATH) }
            }, null, 2));"
          cat dist/latest.json
          TITLE="${TAG#v}"
          NOTES="Haven Desktop Tauri build (${TITLE}). Windows NSIS installer, Linux AppImage and deb. Requires a Haven server. Self-signed server certificates are accepted on Windows and Linux."
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Haven ${TITLE}" --notes "$NOTES" --latest
          fi
          mapfile -t FILES < <(find dist -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.sig' -o -name 'latest.json' \))
          gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Released: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haven</title>
  <link rel="stylesheet" href="/src/welcome.css">
  <style>
    body{overflow-y:auto}
    .error-container{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:56px 20px 40px}
    .error-topbar{position:absolute;top:16px;inset-inline-start:24px}
    .error-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;width:100%;max-width:540px}
    .error-card .hex-logo{font-size:48px;margin:0;animation:pulse 1.6s ease-in-out infinite}
    .error-card h1{font-size:22px;font-weight:700}
    .error-desc{max-width:440px;color:var(--text-dim);font-size:14px;line-height:1.5;white-space:pre-wrap}
    #error-url{display:inline-block;max-width:100%;overflow-wrap:anywhere;padding:6px 12px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);font-size:13px}
    .error-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
    .server-picker-section{width:100%;max-width:540px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px 20px}
    .server-picker-section .recent-servers-list{margin-bottom:12px}
    .picker-error{color:var(--danger);font-size:12px;margin-top:8px}
    @keyframes pulse{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
  </style>
</head>
<body>
  <div class="error-container" id="haven-connection-error">
    <header class="error-topbar">
      <button class="back-btn" id="btn-back-top">← <span id="back-top-text">Back to Server Selection</span></button>
    </header>
    <div class="error-card">
      <div class="hex-logo" aria-hidden="true">⬡</div>
      <h1 id="error-title">Connection Problem</h1>
      <p class="error-desc" id="error-message">Haven couldn't load that server.</p>
      <code id="error-url" hidden></code>
      <div class="error-actions">
        <a class="btn primary" id="btn-retry" href="/__haven_nav__/retry">Try Again</a>
        <a class="btn secondary" id="btn-back-server" hidden href="/__haven_nav__/server">Go Back to My Server</a>
      </div>
    </div>
    <section class="server-picker-section" id="server-picker-section">
      <div class="recent-title" id="picker-title-text">Pick a Different Server</div>
      <div class="recent-servers-list" id="recent-servers-list" hidden></div>
      <form class="custom-server-form" id="custom-server-form">
        <input type="text" id="custom-server-url" placeholder="https://haven.example.com" spellcheck="false" autocomplete="off">
        <button type="submit" class="btn primary" id="btn-connect-custom">Connect</button>
      </form>
      <div class="picker-error" id="custom-server-error" hidden></div>
    </section>
  </div>
  <script type="module" src="/src/connection-error.js"></script>
</body>
</html>

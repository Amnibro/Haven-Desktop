feed_now() byte[>..]:
	secs := time() as int
	days := secs / 86400
	rem := secs % 86400
	z := days + 719468
	era := z / 146097
	doe := z - era * 146097
	yoe := (doe - doe / 1460 + doe / 36524 - doe / 146096) / 365
	y ~= yoe + era * 400
	doy := doe - (365 * yoe + yoe / 4 - yoe / 100)
	mp := (5 * doy + 2) / 153
	d := doy - (153 * mp + 2) / 5 + 1
	m := if mp < 10 { mp + 3 } else { mp - 9 }
	if m <= 2: y += 1
	out byte[>..] ~= []
	format(out, y)
	out.push('-')
	two_digits(out, m)
	out.push('-')
	two_digits(out, d)
	out.push('T')
	two_digits(out, rem / 3600)
	out.push(':')
	two_digits(out, rem % 3600 / 60)
	out.push(':')
	two_digits(out, rem % 60)

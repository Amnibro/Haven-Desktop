amnios(checkout const byte[:], deb const byte[:], version const byte[:]) int:
	p := str(checkout, "/packaging/haven-desktop")
	f := str(p, "/PKGBUILD")
	shafile := str(p, "/.deb.sha256")
	if !sh(str("sha256sum '", deb, "' > '", shafile, "'")): return 1
	shatext byte[>..] ~= []
	read_file(shafile, shatext)
	delete_file(shafile)
	parts := words(shatext)
	sha byte[>..] ~= []
	if parts.len > 0: sha.append(parts[0])
	text byte[>..] ~= []
	read_file(f, text)
	lines := split(text, '\n')
	out byte[>..] ~= []
	got_ver ~= false
	got_rel ~= false
	got_sha ~= false
	for line, i lines:
		if i > 0: out.push('\n')
		if starts_with(line, "pkgver="):
			got_ver = true
			format(out, "pkgver=", version)
		else if starts_with(line, "pkgrel="):
			got_rel = true
			out.append("pkgrel=1")
		else if starts_with(line, "sha256sums="):
			got_sha = true
			format(out, "sha256sums=('", sha, "')")
		else:
			out.append(line)
	if !got_ver || !got_rel || !got_sha:
		say("PKGBUILD is missing a field")
		return 1
	write_file_atomic(f, out)
	repo := str(checkout, "/out/haven-desktop-repo")
	if !sh(str("cp '", deb, "' '", p, "/Haven_", version, "_amd64.deb'")): return 1
	if !sh(str("rm -rf '", repo, "' && mkdir -p '", repo, "'")): return 1
	if !sh(str("cd '", p, "' && PKGEXT=.pkg.tar PKGDEST='", repo, "' makepkg -f --nodeps --noconfirm")): return 1
	if !sh(str("AMNI_LOCAL_REPO='", repo, "' '", checkout, "/tools/publish-repo.sh'")): return 1
	if !sh(str("rm -rf '", p, "/src' '", p, "/pkg' '", p, "/Haven_", version, "_amd64.deb' '", repo, "'")): return 1
	say(str("published haven-desktop ", version, "-1 to the Amni OS repo"))
	return 0

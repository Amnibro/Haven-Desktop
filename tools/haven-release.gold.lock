bump(dir const byte[:], deb const byte[:], version const byte[:]) bool:
	sumfile := str(dir, "/.deb.sha256")
	if !run_step(str("sha256sum '", deb, "' > '", sumfile, "'")):
		return false
	sb byte[>..] ~= []
	sok := read_file(sumfile, sb)
	delete_file(sumfile)
	ws := words(sb)
	if !sok || ws.len == 0:
		return false
	sha := ws[0]
	pb byte[>..] ~= []
	ppath := str(dir, "/PKGBUILD")
	if !read_file(ppath, pb):
		say("PKGBUILD is missing a field")
		return false
	out byte[>..] ~= []
	has_ver ~= false
	has_rel ~= false
	has_sum ~= false
	lines := split(pb, '\n')
	for line, i lines:
		if i > 0:
			out.push('\n')
		if starts_with(line, "pkgver="):
			out.append("pkgver=")
			out.append(version)
			has_ver = true
		else if starts_with(line, "pkgrel="):
			out.append("pkgrel=1")
			has_rel = true
		else if starts_with(line, "sha256sums="):
			out.append("sha256sums=('")
			out.append(sha)
			out.append("')")
			has_sum = true
		else:
			out.append(line)
	if !has_ver || !has_rel || !has_sum:
		say("PKGBUILD is missing a field")
		return false
	write_file_atomic(ppath, out)
	true

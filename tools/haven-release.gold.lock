json_text(s const byte[:]) byte[>..]:
	out byte[>..] ~= []
	hex := "0123456789abcdef"
	out.push('"')
	for c s:
		if c == '"':
			out.append("\\\"")
		else if c == '\\':
			out.append("\\\\")
		else if c == '\n':
			out.append("\\n")
		else if c == '\r':
			out.append("\\r")
		else if c == '\t':
			out.append("\\t")
		else if c < 32:
			out.append("\\u00")
			out.push(hex[c >> 4])
			out.push(hex[c & 15])
		else:
			out.push(c)
	out.push('"')
	out

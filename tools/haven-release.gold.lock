main():
	av := args()
	if av.len == 5:
		if av[1] == "feed":
			exit(feed(av[2], av[3], av[4]))
		if av[1] == "amnios":
			exit(amnios(av[2], av[3], av[4]))
		if av[1] == "aur":
			exit(aur(av[2], av[3], av[4]))
	say("usage: haven-release feed <dir> <version> <notes file> | amnios <amni-os checkout> <deb file> <version> | aur <haven-desktop checkout> <deb file> <version>")
	exit(2)

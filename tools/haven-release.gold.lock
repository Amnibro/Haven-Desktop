aur(checkout const byte[:], deb const byte[:], version const byte[:]) int:
	p := str(checkout, "/packaging/aur")
	a := str(p, "/aur")
	if !bump(p, deb, version):
		return 1
	if !run_step(str("cp '", deb, "' '", p, "/Haven_", version, "_amd64.deb'")):
		return 1
	if !run_step(str("cd '", p, "' && PKGDEST='", p, "/out' makepkg -f --nodeps --noconfirm && makepkg --printsrcinfo > .SRCINFO")):
		return 1
	push_cmd := str("rm -rf '", a, "' && git clone -q ssh://aur@aur.archlinux.org/haven-chat-bin.git '", a, "' && cp '", p, "/PKGBUILD' '", p, "/.SRCINFO' '", a, "/' && cd '", a, "' && git add PKGBUILD .SRCINFO && git -c user.name=\"$(git -C '", checkout, "' config user.name)\" -c user.email=\"$(git -C '", checkout, "' config user.email)\" commit -q -m 'Update to ", version, "-1' && if [ \"$AMNI_DRY_RUN\" = 1 ]; then git show --stat --format='haven-release: dry run, not pushed: %s' HEAD; else git push -q origin HEAD:master && echo 'haven-release: published haven-chat-bin ", version, "-1 to the AUR'; fi")
	if !run_step(push_cmd):
		return 1
	if !run_step(str("rm -rf '", p, "/src' '", p, "/pkg' '", p, "/out' '", a, "' '", p, "/Haven_", version, "_amd64.deb'")):
		return 1
	return 0

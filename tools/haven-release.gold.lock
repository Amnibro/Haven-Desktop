amnios(checkout const byte[:], deb const byte[:], version const byte[:]) int:
	p := str(checkout, "/packaging/haven-desktop")
	if !bump(p, deb, version):
		return 1
	repo := str(checkout, "/out/haven-desktop-repo")
	if !run_step(str("cp '", deb, "' '", p, "/Haven_", version, "_amd64.deb'")):
		return 1
	if !run_step(str("rm -rf '", repo, "' && mkdir -p '", repo, "'")):
		return 1
	if !run_step(str("cd '", p, "' && PKGEXT=.pkg.tar PKGDEST='", repo, "' makepkg -f --nodeps --noconfirm")):
		return 1
	if !run_step(str("AMNI_LOCAL_REPO='", repo, "' bash '", checkout, "/tools/publish-repo.sh'")):
		return 1
	if !run_step(str("rm -rf '", p, "/src' '", p, "/pkg' '", p, "/Haven_", version, "_amd64.deb' '", repo, "'")):
		return 1
	say(str("published haven-desktop ", version, "-1 to the Amni OS repo"))
	return 0

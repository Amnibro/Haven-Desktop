<!DOCTYPE html><html><head><meta charset="utf-8"><title>Share your screen</title><style>
:root{--bg:#0d0f14;--elev:#161a23;--stroke:#262b38;--text:#e8e9f0;--dim:#8b90a5;--accent:#7c5cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,'Segoe UI',sans-serif;user-select:none}
.wrap{display:flex;flex-direction:column;height:100%;padding:20px}
h1{font-size:17px;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--dim);font-size:13px}
.list{flex:1;overflow-y:auto;border:1px solid var(--stroke);border-radius:8px;background:var(--elev)}
label{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--stroke);cursor:pointer}
label:last-child{border-bottom:0}
label:hover{background:#1c2130}
input[type=radio]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.ic{width:26px;height:26px;border-radius:6px;background:#232838;display:grid;place-items:center;font-weight:700;color:var(--dim);flex:0 0 26px;overflow:hidden}
.ic img{width:26px;height:26px}
.n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{font-size:11px;color:#3ddc97;border:1px solid #2a6b50;border-radius:10px;padding:1px 7px}
.note{color:var(--dim);font-size:12px;margin:12px 0 0}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
button{border:1px solid var(--stroke);background:var(--elev);color:var(--text);border-radius:7px;padding:9px 18px;font:600 13px inherit;cursor:pointer}
button.go{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{filter:brightness(1.12)}
.empty{padding:18px 14px;color:var(--dim)}
.kind{display:flex;gap:4px;padding:3px;margin:0 0 14px;border:1px solid var(--stroke);border-radius:8px;background:var(--elev)}
.kind button{flex:1;border:0;background:none;color:var(--dim);padding:7px 0}
.kind button[aria-pressed=true]{background:var(--accent);color:#fff}
h2{font-size:13px;font-weight:600;color:var(--dim);margin:0 0 7px}
</style></head><body><div class="wrap">
<h1>Share your screen</h1>
<div class="kind" role="group" aria-label="What to share"><button type="button" data-kind="screen" aria-pressed="true">Screen</button><button type="button" data-kind="window" aria-pressed="false">Window</button></div>
<p class="sub" id="sub"></p>
<h2>Sound</h2>
<div class="list" id="list"><label><input type="radio" name="a" value="0" checked><span class="ic">&#128263;</span><span class="n">No audio</span></label></div>
<p class="note" id="note"></p>
<div class="row"><button id="cancel">Cancel</button><button class="go" id="go">Continue</button></div>
</div><script>
const inv=(c,a)=>window.__TAURI_INTERNALS__.invoke(c,a);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let kind='screen';try{kind=localStorage.getItem('haven-share-kind')==='window'?'window':'screen'}catch{}
const setKind=k=>{kind=k;document.querySelectorAll('.kind button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===k)));document.getElementById('sub').textContent=k==='window'?'Next, your desktop asks which window to share. Pick an app below to send its sound too.':'Next, your desktop asks which screen to share. Pick an app below to send its sound too.';try{localStorage.setItem('haven-share-kind',k)}catch{}};
document.querySelectorAll('.kind button').forEach(b=>b.onclick=()=>setKind(b.dataset.kind));
setKind(kind);
function done(cancelled){const v=document.querySelector('input[name=a]:checked');inv('share_picker_choose',{cancelled,pid:cancelled?null:Number(v?v.value:0),window:kind==='window'})}
document.getElementById('cancel').onclick=()=>done(true);
document.getElementById('go').onclick=()=>done(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')done(true);if(e.key==='Enter')done(false)});
inv('audio_get_apps').then(apps=>{const L=document.getElementById('list');const seen=new Set();(apps||[]).sort((a,b)=>(b.active-a.active)||a.name.localeCompare(b.name)).forEach(a=>{if(seen.has(a.pid))return;seen.add(a.pid);const icon=a.icon&&/^(data:|https?:)/.test(a.icon)?`<img src="${esc(a.icon)}">`:esc((a.name||'?')[0].toUpperCase());L.insertAdjacentHTML('beforeend',`<label><input type="radio" name="a" value="${a.pid}"><span class="ic">${icon}</span><span class="n">${esc(a.name)}</span>${a.active?'<span class="live">playing</span>':''}</label>`)});if(!seen.size)document.getElementById('note').textContent='No apps are playing sound right now. Start the audio first to share it.'}).catch(()=>{document.getElementById('note').textContent='App audio is unavailable on this system.'});
document.getElementById('go').focus();
</script></body></html>
